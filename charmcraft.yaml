# This file configures Charmcraft.
# See https://juju.is/docs/sdk/charmcraft-config for guidance.

type: charm
platforms:
  # Build each platform on its native architecture: the uv plugin installs
  # host-architecture wheels, so cross-building would corrupt native dependencies.
  ubuntu-24.04-amd64:
    build-on: [ubuntu@24.04:amd64]
    build-for: [ubuntu@24.04:amd64]
  ubuntu-26.04-amd64:
    build-on: [ubuntu@26.04:amd64]
    build-for: [ubuntu@26.04:amd64]
  ubuntu-26.04-arm64:
    build-on: [ubuntu@26.04:arm64]
    build-for: [ubuntu@26.04:arm64]
  ubuntu-26.04-s390x:
    build-on: [ubuntu@26.04:s390x]
    build-for: [ubuntu@26.04:s390x]
  ubuntu-26.04-ppc64el:
    build-on: [ubuntu@26.04:ppc64el]
    build-for: [ubuntu@26.04:ppc64el]

parts:
  files:
    plugin: dump
    source: .
    stage:
      - files
  charm:
    after:
      - files
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      - build-essential
      # cryptography has no s390x wheel in uv.lock; build its Rust extension
      # against the build base's OpenSSL rather than relying on runner packages.
      - on s390x:
          - cargo
          - rustc
          - pkg-config
          - libssl-dev
          - libffi-dev
