name: Push (main)

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: python3 -m pip install tox
      - name: Run linters
        run: tox -e pep8

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: python -m pip install tox
      - name: Run tests
        run: tox -e py3

  build:
    name: Build the charms
    uses: ./.github/workflows/build.yaml

  release-to-charmhub:
    name: Release to CharmHub
    permissions:
      contents: write          # allow charming-actions to create the git tag
    needs:
      - lint
      - unit-test
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download built charms
        uses: actions/download-artifact@v4
        with:
          name: charms
          path: built-charms

      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Validate release artifacts
        id: artifacts
        run: |
          # Refuse partial releases or artifacts for the wrong base/architecture.
          artifacts=$(/usr/bin/python3 tests/scripts/check_charm_artifacts.py built-charms)
          echo "artifacts=${artifacts}" >> "${GITHUB_OUTPUT}"

      # `tag-prefix: tentacle` namespaces the GitHub tags created by
      # charming-actions so tentacle revisions are distinguishable from
      # squid revisions (which the stable/squid branch publishes with a
      # different prefix).
      - name: Release to tentacle/edge
        uses: canonical/charming-actions/upload-charm@2.7.0
        with:
          credentials: "${{ secrets.CHARMHUB_TOKEN }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          channel: tentacle/edge
          built-charm-path: "${{ steps.artifacts.outputs.artifacts }}"
          charmcraft-channel: latest/candidate
          tag-prefix: tentacle
